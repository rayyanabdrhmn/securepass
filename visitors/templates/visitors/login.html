{% extends "visitors/base.html" %}
{% block content %}
<div class="card shadow-sm visitor-card">
  <div class="card-body">
    <h2 class="visitor-card-title">Guard / Admin Login</h2>
    <form method="post" class="mt-3">
      {% csrf_token %}
      {% if form.errors %}
        <div id="login_error" class="alert alert-danger" role="alert">Wrong username or password.</div>
      {% endif %}
      <div class="mb-3">
        <label for="id_username" class="form-label">Username</label>
        <input type="text" name="username" id="id_username" class="form-control" required autofocus
               autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"
               {% if form.errors %}aria-invalid="true" aria-describedby="login_error"{% endif %}>
      </div>
      <div class="mb-3">
        <label for="id_password" class="form-label">Password</label>
        <input type="password" name="password" id="id_password" class="form-control" required
               autocomplete="current-password"
               {% if form.errors %}aria-invalid="true" aria-describedby="login_error"{% endif %}>
      </div>
      <button type="submit" class="btn btn-success w-100 visitor-action visitor-submit">Login</button>
    </form>
  </div>
</div>
{% endblock %}
