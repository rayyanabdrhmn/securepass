{% extends "visitors/base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="mb-0">Scan Visitor Pass</h5>
  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button class="btn btn-sm btn-outline-secondary">Logout</button>
  </form>
</div>

<div id="reader" class="mb-3"></div>

<div class="input-group mb-3">
  <input type="text" id="manual" class="form-control" placeholder="Or paste Pass ID here">
  <button class="btn btn-success" id="manualBtn">Submit</button>
</div>

<div id="result"></div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  const csrf = "{{ csrf_token }}";
  let busy = false;
  let lastToken = "";
  let lastTime = 0;

  function show(data) {
    const box = document.getElementById("result");
    box.innerHTML = "";
    const card = document.createElement("div");
    let style = "alert-success";
    if (!data.ok) style = "alert-danger";
    else if (data.action === "inside") style = "alert-info";
    card.className = "alert " + style;
    const lines = [data.message, data.name, data.plate, data.phone];
    lines.forEach((text, i) => {
      if (!text) return;
      const p = document.createElement("div");
      if (i === 0) p.className = "fw-bold";
      p.textContent = text;   // textContent keeps visitor input safe
      card.appendChild(p);
    });
    const time = document.createElement("div");
    time.className = "small text-muted mt-1";
    time.textContent = "Scanned at " + new Date().toLocaleTimeString();
    card.appendChild(time);
    box.appendChild(card);
  }

  async function sendToken(token, fromButton) {
    token = (token || "").trim();
    if (!token || busy) return;
    const now = Date.now();
    // The camera reads the same QR many times a second, so ignore repeats for 15 seconds
    if (!fromButton && token === lastToken && now - lastTime < 15000) return;
    lastToken = token;
    lastTime = now;
    busy = true;
    try {
      const res = await fetch("{% url 'scan_api' %}", {
        method: "POST",
        headers: {"Content-Type": "application/json", "X-CSRFToken": csrf},
        body: JSON.stringify({token: token}),
      });
      show(await res.json());
    } catch (e) {
      show({ok: false, message: "Network error. Try again."});
    }
    busy = false;
  }

  document.getElementById("manualBtn").addEventListener("click", () => {
    sendToken(document.getElementById("manual").value, true);
  });

  const scanner = new Html5QrcodeScanner("reader", {fps: 10, qrbox: 220}, false);
  scanner.render((text) => sendToken(text, false), () => {});
</script>
{% endblock %}
