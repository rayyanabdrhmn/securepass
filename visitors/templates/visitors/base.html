<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNITEN SecurePass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .page-narrow { max-width: 480px; }
    .page-wide { max-width: 960px; }
  </style>
</head>
<body class="bg-light">
  <div class="container py-4 {% block pagewidth %}page-narrow{% endblock %}">
    <h3 class="text-center text-success mb-3">UNITEN SecurePass</h3>
    {% if user.is_authenticated %}
      <div class="text-center mb-3">
        <a href="{% url 'scanner' %}" class="btn btn-sm btn-outline-success">Scanner</a>
        <a href="{% url 'dashboard' %}" class="btn btn-sm btn-outline-success">Dashboard</a>
      </div>
    {% endif %}
    {% for message in messages %}
      <div class="alert alert-info">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
